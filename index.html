<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindling — Compartilhamento de tela privado</title>
    <meta name="description" content="Compartilhamento de tela em tempo real para grupos privados." />
    <!-- Sem indexação — app privado -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sr_theme");
          var theme = stored || (
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
          );
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
