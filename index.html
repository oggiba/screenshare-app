<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Kindling — Compartilhamento de tela privado</title>
    <meta name="description" content="Compartilhamento de tela em tempo real para grupos privados." />
    <!-- Sem indexação — app privado -->
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23C9702D'%3E%3Cpath d='M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c1 1 1.5 2.5 1.5 4A4.5 4.5 0 0 1 12 18.5 4.5 4.5 0 0 1 7.5 14c0-3 1.5-4.5 2.5-6 .3 1 .3 2 1 2.5C10.5 8 12 5 12 2z'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sr_theme");
          var theme = stored || (
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
          );
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
